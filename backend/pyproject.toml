[project]
name = "job-scraper"
version = "0.1.0"
description = ""
authors = [{ name = "Jihyeok Jeong", email = "wlgurdlcjswo@naver.com" }]
requires-python = ">=3.10"
# readme is at project root (../README.md), omitted for Docker compatibility
dependencies = [
    "beautifulsoup4>=4.12.3,<5",
    "python-dotenv>=1.0.1,<2",
    "requests>=2.32.3,<3",
    "inquirer>=3.4.0,<4",
    "selenium>=4.26.1,<5",
    "httpx[http2]>=0.27.2,<0.28",
    "fake-useragent>=1.5.1,<2",
    "lxml>=5.3.0,<6",
    "playwright==1.48.0",
    "cssselect>=1.2.0,<2",
    "pytest-playwright>=0.6.2,<0.7",
    "pytest>=8.3.4,<9",
    "sqlalchemy>=2.0.37,<3",
    "psycopg2-binary>=2.9.9,<3",
    "asyncpg>=0.29.0,<1",
    "matplotlib>=3.10.3",
    "pandas>=2.3.1",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.30.0",
    "python-lsp-server>=1.14.0",
    "label-studio>=1.23.0",
    "redis>=5.2.1",
    "python-multipart>=0.0.22",
    "alembic>=1.13.0,<2",
    "pyyaml>=6.0,<7",
    "snakeviz>=2.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
ignore = ["E203", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["app"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.3",
]
