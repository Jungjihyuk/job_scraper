# 산업 도메인 분류 체계 (Taxonomy)
# Version: 1.0.0
# Last Updated: 2026-03-31

version: "1.0.0"

categories:
  금융/핀테크:
    description: "금융 서비스 및 핀테크 분야"
    inclusion_criteria:
      - "은행, 증권, 보험, 결제 등 전통 금융 서비스"
      - "핀테크 스타트업 (간편결제, P2P, 로보어드바이저)"
      - "블록체인/암호화폐/DeFi 서비스"
      - "자산관리, 투자 플랫폼"
    exclusion_criteria:
      - "금융사 내부 IT 인프라팀 (→ SaaS/B2B로 분류)"
      - "단순 결제 연동만 하는 커머스 (→ 커머스/리테일)"
    edge_cases:
      - case: "간편결제가 주력인 커머스 플랫폼"
        resolution: "핵심 비즈니스가 결제이면 금융/핀테크, 커머스가 주력이면 커머스/리테일"
      - case: "블록체인 기반 게임 (P2E)"
        resolution: "게임 플레이가 핵심이면 게임, 토큰 이코노미가 핵심이면 금융/핀테크"
    keywords:
      - "금융"
      - "핀테크"
      - "fintech"
      - "은행"
      - "증권"
      - "보험"
      - "결제"
      - "payment"
      - "투자"
      - "자산관리"
      - "뱅킹"
      - "banking"
      - "카드"
      - "대출"
      - "송금"
      - "블록체인"
      - "암호화폐"
      - "가상자산"
      - "디파이"
      - "defi"

  바이오/헬스케어:
    description: "바이오테크, 의료, 디지털 헬스케어 분야"
    inclusion_criteria:
      - "제약/신약 개발, 임상시험 관련"
      - "의료 정보 시스템 (EMR, PHR, PACS)"
      - "디지털 헬스케어/원격진료 플랫폼"
      - "유전체/바이오인포매틱스"
    exclusion_criteria:
      - "웰니스/피트니스 앱 (→ 콘텐츠/미디어 또는 커머스)"
      - "의료기기 하드웨어 설계 (→ 제조/하드웨어)"
    edge_cases:
      - case: "건강식품 커머스"
        resolution: "헬스케어 데이터 활용이 핵심이면 바이오/헬스케어, 판매가 핵심이면 커머스"
      - case: "AI 신약 발굴"
        resolution: "바이오/헬스케어로 분류 (도메인 우선, 기술은 core_technologies에서 추적)"
    keywords:
      - "바이오"
      - "헬스케어"
      - "healthcare"
      - "의료"
      - "병원"
      - "제약"
      - "신약"
      - "임상"
      - "유전체"
      - "genomics"
      - "진단"
      - "의약"
      - "건강"
      - "디지털헬스"
      - "원격진료"
      - "EMR"
      - "PHR"

  커머스/리테일:
    description: "이커머스, 오프라인 리테일, 물류/풀필먼트"
    inclusion_criteria:
      - "B2C/B2B 온라인 쇼핑몰, 마켓플레이스"
      - "배송/물류/풀필먼트 서비스"
      - "오프라인 리테일 테크 (POS, 재고관리)"
    exclusion_criteria:
      - "물류 자동화 로봇 개발 (→ AI/딥테크)"
      - "중고 거래 커뮤니티 (→ 콘텐츠/미디어)"
    edge_cases:
      - case: "라이브 커머스 플랫폼"
        resolution: "상품 판매가 핵심이면 커머스, 영상 스트리밍이 핵심이면 콘텐츠/미디어"
      - case: "식품 배달 플랫폼"
        resolution: "커머스/리테일로 분류 (배달=물류의 일종)"
    keywords:
      - "커머스"
      - "이커머스"
      - "e-commerce"
      - "ecommerce"
      - "쇼핑"
      - "리테일"
      - "retail"
      - "상품"
      - "주문"
      - "배송"
      - "물류"
      - "풀필먼트"
      - "마켓플레이스"
      - "marketplace"
      - "셀러"
      - "입점"

  게임:
    description: "게임 개발, 퍼블리싱, 라이브 운영"
    inclusion_criteria:
      - "게임 클라이언트/서버 개발"
      - "게임 엔진 개발 (Unity, Unreal 등)"
      - "게임 운영/라이브서비스"
      - "게임 퍼블리싱/마케팅"
    exclusion_criteria:
      - "게임 관련 커머스 (→ 커머스/리테일)"
      - "게임 스트리밍 플랫폼 (→ 콘텐츠/미디어)"
    edge_cases:
      - case: "메타버스 플랫폼"
        resolution: "게임 요소가 핵심이면 게임, 소셜/업무 목적이면 SaaS/B2B"
      - case: "게이미피케이션 교육 앱"
        resolution: "교육이 핵심 목적이면 교육/에듀테크"
    keywords:
      - "게임"
      - "game"
      - "gaming"
      - "모바일게임"
      - "PC게임"
      - "콘솔"
      - "게임서버"
      - "게임엔진"
      - "unity"
      - "unreal"
      - "게임개발"
      - "라이브서비스"
      - "게임운영"

  콘텐츠/미디어:
    description: "디지털 콘텐츠, 미디어, 엔터테인먼트"
    inclusion_criteria:
      - "OTT/스트리밍 서비스"
      - "웹툰, 웹소설, 음악 플랫폼"
      - "뉴스/미디어 플랫폼"
      - "크리에이터 이코노미 서비스"
    exclusion_criteria:
      - "광고 기술(AdTech) 플랫폼 (→ SaaS/B2B)"
      - "소셜 미디어의 커머스 기능 (→ 커머스/리테일)"
    edge_cases:
      - case: "숏폼 동영상 + 커머스"
        resolution: "콘텐츠 소비가 메인 UX이면 콘텐츠/미디어"
      - case: "팟캐스트 플랫폼"
        resolution: "콘텐츠/미디어로 분류"
    keywords:
      - "콘텐츠"
      - "미디어"
      - "media"
      - "영상"
      - "동영상"
      - "스트리밍"
      - "OTT"
      - "음악"
      - "웹툰"
      - "만화"
      - "출판"
      - "뉴스"
      - "크리에이터"
      - "라이브"
      - "방송"

  SaaS/B2B:
    description: "B2B 소프트웨어, 기업용 서비스, 플랫폼"
    inclusion_criteria:
      - "SaaS 형태의 기업용 소프트웨어"
      - "ERP, CRM, 그룹웨어 등 업무 툴"
      - "API/SDK 제공 기업"
      - "개발자 도구, DevOps 플랫폼"
    exclusion_criteria:
      - "B2C 서비스가 주력인 기업의 B2B 부문"
      - "SI/컨설팅 프로젝트 (→ 기업유형에서 SI로 분류)"
    edge_cases:
      - case: "B2B2C 모델"
        resolution: "최종 고객이 기업이면 SaaS/B2B, 일반 사용자이면 해당 도메인으로"
      - case: "클라우드 인프라 서비스"
        resolution: "SaaS/B2B로 분류"
    keywords:
      - "SaaS"
      - "B2B"
      - "기업용"
      - "솔루션"
      - "플랫폼"
      - "ERP"
      - "CRM"
      - "그룹웨어"
      - "협업"
      - "워크플로우"
      - "자동화"
      - "엔터프라이즈"
      - "enterprise"
      - "API"
      - "SDK"

  교육/에듀테크:
    description: "교육 서비스, 이러닝, 에듀테크"
    inclusion_criteria:
      - "온라인 교육 플랫폼 (MOOC, LMS)"
      - "코딩 교육, 직무 교육 서비스"
      - "K-12 교육 테크, 학원 관리"
    exclusion_criteria:
      - "사내 교육 시스템 (→ SaaS/B2B)"
      - "교육 콘텐츠만 제작하는 미디어사 (→ 콘텐츠/미디어)"
    edge_cases:
      - case: "코딩 부트캠프 + 채용 연계"
        resolution: "교육이 핵심 수익이면 교육/에듀테크"
      - case: "AI 튜터 서비스"
        resolution: "교육/에듀테크로 분류 (AI는 기술, 교육은 도메인)"
    keywords:
      - "교육"
      - "에듀테크"
      - "edtech"
      - "학습"
      - "온라인교육"
      - "LMS"
      - "이러닝"
      - "e-learning"
      - "강의"
      - "수강"
      - "학원"
      - "튜터"
      - "커리큘럼"

  모빌리티/자동차:
    description: "모빌리티, 자율주행, 운송/물류 테크"
    inclusion_criteria:
      - "자율주행 기술 개발"
      - "라이드헤일링/택시 플랫폼"
      - "커넥티드카, 전기차(EV) 소프트웨어"
      - "내비게이션, 지도 서비스"
    exclusion_criteria:
      - "물류 배달 서비스 (→ 커머스/리테일)"
      - "자동차 부품 제조 (→ 제조/하드웨어)"
    edge_cases:
      - case: "킥보드/자전거 공유 서비스"
        resolution: "모빌리티/자동차로 분류"
      - case: "차량 중고 거래 플랫폼"
        resolution: "커머스/리테일로 분류"
    keywords:
      - "모빌리티"
      - "mobility"
      - "자동차"
      - "자율주행"
      - "autonomous"
      - "커넥티드카"
      - "전기차"
      - "EV"
      - "라이드"
      - "택시"
      - "내비게이션"
      - "지도"
      - "map"
      - "운송"
      - "물류"

  보안/사이버보안:
    description: "정보보안, 사이버보안, 보안 솔루션"
    inclusion_criteria:
      - "보안 솔루션 개발 (방화벽, EDR, SIEM 등)"
      - "취약점 진단, 모의해킹 서비스"
      - "인증/권한 관리 플랫폼"
      - "보안 컨설팅/관제 서비스"
    exclusion_criteria:
      - "일반 서비스 내 보안팀 (도메인은 해당 서비스의 도메인)"
      - "물리 보안 (CCTV 등) (→ 제조/하드웨어)"
    edge_cases:
      - case: "클라우드 보안(CSPM) 서비스"
        resolution: "보안이 핵심 제품이면 보안/사이버보안"
      - case: "블록체인 보안 감사"
        resolution: "보안/사이버보안으로 분류"
    keywords:
      - "보안"
      - "사이버보안"
      - "cybersecurity"
      - "security"
      - "정보보안"
      - "취약점"
      - "침해"
      - "인증"
      - "암호화"
      - "방화벽"
      - "SOC"
      - "SIEM"
      - "제로트러스트"

  AI/딥테크:
    description: "AI 핵심 기술 연구/개발, 딥테크 기업"
    inclusion_criteria:
      - "AI/ML 모델 연구 및 개발이 핵심 비즈니스"
      - "AI 플랫폼/인프라 서비스"
      - "로보틱스, 자동화 기술 기업"
      - "LLM, 생성형 AI 서비스 기업"
    exclusion_criteria:
      - "AI를 도구로만 활용하는 서비스 (도메인은 실제 비즈니스 도메인으로)"
      - "AI 교육 서비스 (→ 교육/에듀테크)"
    edge_cases:
      - case: "AI 챗봇 SaaS"
        resolution: "AI 기술이 핵심 차별점이면 AI/딥테크, 고객 서비스가 핵심이면 SaaS/B2B"
      - case: "AI 기반 의료 진단"
        resolution: "의료 도메인이 명확하면 바이오/헬스케어 (AI는 core_technologies에서 추적)"
    keywords:
      - "AI"
      - "인공지능"
      - "딥러닝"
      - "deep learning"
      - "머신러닝"
      - "machine learning"
      - "자연어처리"
      - "NLP"
      - "컴퓨터비전"
      - "로보틱스"
      - "robotics"
      - "자동화"
      - "LLM"
      - "생성형"
