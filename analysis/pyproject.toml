[project]
name = "job-scraper-analysis"
version = "0.1.0"
description = "데이터 분석 및 AI 작업 환경"
authors = [{ name = "Jihyeok Jeong", email = "wlgurdlcjswo@naver.com" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # 데이터 분석
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    # Jupyter
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "notebook>=7.0",
    # NLP / 텍스트 분석
    "konlpy>=0.6",
    "scikit-learn>=1.3",
    "wordcloud>=1.9",
    # DB 접근
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "kiwipiepy>=0.23.0",
    "sentence-transformers>=5.3.0",
    "umap-learn>=0.5.11",
    "hdbscan>=0.8.41",
    "koreanize-matplotlib>=0.1.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
ai = [
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
    "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
