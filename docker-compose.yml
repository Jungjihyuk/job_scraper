services:
  postgres:
    image: postgres:18
    container_name: job_scraper_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./label_studio/init_label_studio_db.sh:/docker-entrypoint-initdb.d/02-create-label-studio-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: job_scraper_backend
    working_dir: /app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DATABASE_URL: "postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}"
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./README.md:/app/README.md
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "uv sync && uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:22-bookworm
    container_name: job_scraper_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      CI: "true"
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    command: >
      sh -c "corepack enable && pnpm install --force && cd apps/web && pnpm dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: job_scraper_label_studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
      DJANGO_DB: default
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
      POSTGRE_USER: ${DB_USER}
      POSTGRE_PASSWORD: ${DB_PASSWORD}
      POSTGRE_NAME: label_studio_db
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    volumes:
      - label-studio-data:/label-studio/data
      - ./label_studio/datasets:/label-studio/files/labeling_data:ro
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-data:
  label-studio-data:
